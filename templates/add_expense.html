<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense – Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="topbar">
    <div class="topbar-inner">
        <a href="{{ url_for('index') }}" class="logo">
            <span class="logo-dot"></span> Expense Tracker
        </a>
        <div class="topbar-actions">
            <a href="{{ url_for('index') }}" class="btn btn-outline btn-sm">&larr; Dashboard</a>
        </div>
    </div>
</div>

<div class="wrap">
    <div class="form-page">
        <div class="form-card">
            <h2>Add New Expense</h2>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="field-group">
                    <label for="title">Title / Description</label>
                    <input type="text" id="title" name="title" placeholder="e.g. Groceries, Coffee, Electric Bill" required autofocus>
                </div>
                <div class="field-row">
                    <div class="field-group">
                        <label for="amount">Amount ($)</label>
                        <input type="number" step="0.01" min="0.01" id="amount" name="amount" placeholder="0.00" required>
                    </div>
                    <div class="field-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" name="category" placeholder="e.g. Food, Utilities, Transport" list="cat-suggestions" required>
                        <datalist id="cat-suggestions">
                            <option value="Food & Dining">
                            <option value="Transportation">
                            <option value="Utilities">
                            <option value="Entertainment">
                            <option value="Shopping">
                            <option value="Healthcare">
                            <option value="Education">
                            <option value="Personal">
                            <option value="Other">
                        </datalist>
                    </div>
                </div>
                <div class="field-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-footer">
                    <button type="submit" class="btn btn-blue">Save Expense</button>
                    <a href="{{ url_for('index') }}" class="btn btn-gray">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
