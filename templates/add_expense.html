<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">

    <p><a href="{{ url_for('index') }}">&larr; Back</a></p>

    <div class="form-box">
        <h2 style="margin-top:0;">Add Expense</h2>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('add_expense') }}">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="e.g. Groceries" required>
            </div>
            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" step="0.01" id="amount" name="amount" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" placeholder="e.g. Food" required>
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-blue">Save</button>
                <a href="{{ url_for('index') }}" class="btn btn-gray">Cancel</a>
            </div>
        </form>
    </div>

</div>
<script>
document.getElementById('date').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
